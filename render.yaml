services:
  - type: web
    name: telegram-auth-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_SECRET
        generateValue: true
      - key: BOT_USERNAME
        sync: false
      - key: PORT
        value: "8080"
      - key: DATABASE_PATH
        value: /var/data/auth.db
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
